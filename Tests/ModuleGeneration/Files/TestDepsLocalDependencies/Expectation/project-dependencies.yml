packages:
  XcodeGen:
    path: local/Packages/XcodeGen
  Yams:
    path: local/Packages/Yams
  swift-argument-parser:
    path: local/Packages/swift-argument-parser
  swift-crypto:
    branch: master
    url: https://github.com/apple/swift-crypto
targetTemplates:
  PackageInclusionTemplate:
    dependencies:
    - package: XcodeGen
      products:
      - XcodeGen
    - package: Yams
      products:
      - Yams
    - package: swift-argument-parser
      products:
      - swift-argument-parser
    - package: swift-crypto
      products:
      - swift-crypto
